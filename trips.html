<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E2530">
<meta name="description" content="RideEasy – rent bikes and cars in minutes.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RideEasy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<title>My Trips - RideEasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="trips">
<main>

<section class="page-header">
  <p class="hero-eyebrow">My Trips</p>
  <h1>Your Bookings</h1>
  <p class="hero-desc">Track upcoming rides, get directions to your pickup point, or cancel a booking.</p>
</section>
<section class="filter-bar" id="tripTabs">
  <button class="filter-btn active" data-tab="upcoming">Upcoming</button>
  <button class="filter-btn" data-tab="past">Past</button>
  <button class="filter-btn" data-tab="cancelled">Cancelled</button>
</section>
<section class="trip-list" id="tripList"></section>

</main>
<script src="js/main.js"></script>
</body>
</html>
